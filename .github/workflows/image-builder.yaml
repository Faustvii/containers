---
name: "Image builder"

# Builds one image from `<image>/docker-bake.hcl` (target `image-all`). With
# `release`, pushes `ghcr.io/faustvii/containers/<image>:<version>` and attests
# its build provenance; otherwise only builds.
#
# Declares no permissions so it inherits the caller's: pull requests grant
# `contents: read`, releases also grant packages/id-token/attestations write.
on:
  workflow_call:
    inputs:
      image:
        description: Image directory name
        type: string
        required: true
      version:
        description: Version to tag the image with (required with release)
        type: string
        default: ""
      release:
        description: Push and attest the image
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/faustvii/containers/${{ inputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Emulates foreign platforms for Dockerfiles that RUN target-arch binaries.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ inputs.release }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release inputs
        if: ${{ inputs.release }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::version input is required when release is true"
            exit 1
          fi

      # The source label points at the image's directory at the built commit:
      # Renovate turns a /tree/<ref>/<dir> URL into a sourceDirectory and reads
      # that directory's CHANGELOG.md for release notes.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.release }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.source=https://github.com/Faustvii/containers/tree/${{ github.sha }}/${{ inputs.image }}

      - name: Build
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ./${{ inputs.image }}
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: image-all
          push: ${{ inputs.release }}

      - name: Digest
        if: ${{ inputs.release }}
        id: digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          VERSION: ${{ inputs.version }}
        run: |
          digest=$(jq --raw-output '."image-all"."containerimage.digest"' <<<"${METADATA}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${VERSION}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      # Ties the pushed digest to this repository, commit and workflow run;
      # check with `gh attestation verify oci://<image>@<digest> -R Faustvii/containers`.
      - name: Attest build provenance
        if: ${{ inputs.release }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        # Carried over from the attest-build-provenance wrapper, for registry
        # responses with headers over Node's 16 KB default.
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # Storage records are only created for organization-owned repos.
          create-storage-record: false
