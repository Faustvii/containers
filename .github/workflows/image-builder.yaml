---
name: "Image builder"

# Builds one image from `<image>/docker-bake.hcl` (target `image-all`). With
# `release`, pushes `ghcr.io/faustvii/containers/<image>:<version>` and attests
# its build provenance; otherwise only builds.
on:
  workflow_call:
    inputs:
      image:
        description: Image directory name
        type: string
        required: true
      version:
        description: Version to tag the image with (required with release)
        type: string
        default: ""
      release:
        description: Push and attest the image
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/faustvii/containers/${{ inputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Emulates foreign platforms for Dockerfiles that RUN target-arch binaries.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ inputs.release }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label points at the image's directory: Renovate turns a
      # /tree/<ref>/<dir> URL into a sourceDirectory and reads that
      # directory's CHANGELOG.md for release notes.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.release }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.source=https://github.com/Faustvii/containers/tree/main/${{ inputs.image }}

      - name: Build
        id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: ./${{ inputs.image }}
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: image-all
          push: ${{ inputs.release }}

      - name: Digest
        if: ${{ inputs.release }}
        id: digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          VERSION: ${{ inputs.version }}
        run: |
          digest=$(jq --raw-output '."image-all"."containerimage.digest"' <<<"${METADATA}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${VERSION}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      # Ties the pushed digest to this repository, commit and workflow run;
      # check with `gh attestation verify oci://<image>@<digest> -R Faustvii/containers`.
      - name: Attest build provenance
        if: ${{ inputs.release }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
