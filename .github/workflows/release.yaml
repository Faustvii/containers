---
name: "Release"

# release-please keeps a release PR open per image (konflate-tool, playground)
# from the conventional commits touching that directory. Merging it tags
# `<image>-v<version>` with a GitHub release, and this workflow then builds and
# pushes `ghcr.io/faustvii/containers/<image>:<version>`. The semver tag is what
# lets Renovate look up the image's labels and match the GitHub release notes.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases: ${{ toJSON(steps.release.outputs) }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Release please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and push ${{ matrix.image }}
    needs: release-please
    if: ${{ needs.release-please.outputs.paths_released != '[]' && needs.release-please.outputs.paths_released != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    env:
      IMAGE: ghcr.io/faustvii/containers/${{ matrix.image }}
      VERSION: ${{ fromJSON(needs.release-please.outputs.releases)[format('{0}--version', matrix.image)] }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label points at the image's directory: Renovate turns a
      # /tree/<ref>/<dir> URL into a sourceDirectory and reads that
      # directory's CHANGELOG.md for release notes.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/Faustvii/containers/tree/main/${{ matrix.image }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          # playground's Dockerfile downloads an amd64 kubectl.
          platforms: ${{ matrix.image == 'playground' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Ties the pushed digest to this repository, commit and workflow run;
      # check with `gh attestation verify oci://<image>@<digest> -R Faustvii/containers`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}:${VERSION}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
